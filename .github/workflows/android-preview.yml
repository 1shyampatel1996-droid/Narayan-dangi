name: Android preview
on:
  push:
    branches: [android-native-scanner]
    paths: ['android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test rules and build demo APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: narayan-scanner-OFFLINE-PREVIEW
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
